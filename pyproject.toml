[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "provenance"
version = "0.3.0"
description = "Cross-archive identifier-resolution and positional provenance consistency audit between the NASA Exoplanet Archive and SIMBAD for real confirmed exoplanet host stars."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Biswajit Jana" }]
keywords = ["astroinformatics", "provenance", "exoplanets", "astrophysics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]

[project.scripts]
provenance = "provenance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: requires internet access to the NASA Exoplanet Archive and SIMBAD"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py310"
